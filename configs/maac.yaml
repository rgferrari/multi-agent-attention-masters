common:
  env: simple_speaker_listener_v4
  episodes: 60000
  max_cycles: 25
  seed: 0
  render_mode: none
  continuous_actions: false
  use_gpu: false
  log_dir: runs
  save_dir: checkpoints
  save_every: 0
  save_final: true
  early_stop_patience: 0
  early_stop_min_delta: 0.01
  early_stop_start_episode: 100
  early_stop_window: 10
  early_stop_metric: mean_reward
  early_stop_mode: max
  train: true
  lr: 0.01

maac:
  buffer_size: 1000000
  batch_size: 1024
  steps_per_update: 100
  num_updates: 4
  gamma: 0.95
  tau: 0.01
  pi_lr: 0.01
  q_lr: 0.01
  reward_scale: 10.0
  pol_hidden_dim: 64
  critic_hidden_dim: 64
  attend_heads: 4
