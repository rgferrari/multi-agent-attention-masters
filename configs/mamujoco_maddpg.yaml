common:
  env: ma_halfcheetah_2x3   # label only; set automatically from scenario/agent_conf
  episodes: 20000
  max_cycles: 1000          # MuJoCo episodes are long (vs. 25 for MPE)
  seed: 0
  render_mode: none
  continuous_actions: true  # MAMuJoCo is always continuous (flag is a no-op here)
  use_gpu: false
  log_dir: runs
  save_dir: checkpoints
  save_every: 0
  save_final: true
  early_stop_patience: 0
  early_stop_min_delta: 0.01
  early_stop_start_episode: 100
  early_stop_window: 10
  early_stop_metric: mean_reward
  early_stop_mode: max
  train: true

# MAMuJoCo scenario selection (CLI --scenario / --agent_conf override these).
# HalfCheetah factorizations: 2x3, 6x1 ; Ant factorizations: 2x4, 4x2, 2x4d
mamujoco:
  scenario: HalfCheetah
  agent_conf: "2x3"
  agent_obsk: 1

maddpg:
  buffer_size: 1000000
  batch_size: 1024
  tau: 0.01
  gamma: 0.95
  actor_lr: 0.001          # continuous control: smaller LR than MPE's 0.01
  critic_lr: 0.001
  expl_noise: 0.1          # Gaussian exploration noise on actions
  hidden_dim: 256          # larger nets than MPE (64) for MuJoCo state dims
  start_steps: 25000       # warmup of random/exploratory steps before updates
  update_every: 100
  updates_per_step: 1
  discrete_temperature: 1.0  # unused for continuous actions
  epsilon: 0.0               # unused for continuous actions (discrete-only epsilon-greedy)
