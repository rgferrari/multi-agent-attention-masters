common:
  env: ma_halfcheetah_2x3   # label only; set automatically from scenario/agent_conf
  episodes: 20000
  max_cycles: 1000
  seed: 0
  use_gpu: false
  log_dir: runs
  save_dir: checkpoints
  save_every: 0
  save_final: true
  early_stop_patience: 0
  early_stop_min_delta: 0.01
  early_stop_start_episode: 100
  early_stop_window: 10
  early_stop_metric: mean_reward
  early_stop_mode: max
  train: true

mamujoco:
  scenario: HalfCheetah
  agent_conf: "2x3"
  agent_obsk: 1

maac_continuous:
  buffer_size: 1000000
  batch_size: 1024
  tau: 0.01
  gamma: 0.95
  pi_lr: 0.001
  q_lr: 0.001
  reward_scale: 10.0
  pol_hidden_dim: 256
  critic_hidden_dim: 256
  attend_heads: 4
  start_steps: 25000       # warmup steps before policy updates begin
  update_every: 100
  num_updates: 1
