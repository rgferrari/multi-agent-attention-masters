common:
  env: simple_spread_v3
  episodes: 50000
  max_cycles: 25
  seed: 0
  render_mode: none
  continuous_actions: false
  use_gpu: false
  run_name: null
  log_dir: runs
  save_dir: checkpoints
  save_every: 0
  save_final: true
  early_stop_patience: 0
  early_stop_min_delta: 0.01
  early_stop_start_episode: 100
  early_stop_window: 10
  early_stop_metric: mean_reward
  early_stop_mode: max
  train: true
  # Write this run's report figures when training finishes.
  auto_report: true

mat:
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  ppo_epoch: 15
  num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1.0
  max_grad_norm: 10.0
  # Single optimizer over the shared transformer (no split actor/critic lrs).
  lr: 0.0005
  # Transformer size: n_embd must be divisible by n_head.
  n_block: 1
  n_embd: 64
  n_head: 1
  use_clipped_value_loss: true
